name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build sitemap
        run: bun run sitemap
      - name: Validate sitemap & robots
        run: bun run validate:sitemap
      - name: Sitemap diff report (vs. produção)
        run: bun run diff:sitemap
      - name: Upload sitemap diff report
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-diff
          path: sitemap-diff.md
          if-no-files-found: warn
          retention-days: 14
      - name: Validate OG images
        run: bun run check:og
      - name: Validate JSON-LD structured data
        run: bun run validate:jsonld
      - name: Gate — CTAs de WhatsApp com data-wa-source/data-service/aria-label
        run: bun run check:cta-attrs
      - name: Gate — claims comerciais comprovados
        run: bun run check:claims
      - name: Gate — preço legado (bancada R$ 90) e marcadores proibidos
        run: bun run check:legacy-price
      - name: Gate — fonte única R$ 99,99 / R$ 299,99 presente
        run: |
          rg -q "99,99" src/data/pricingPolicy.ts || { echo "R$ 99,99 ausente da fonte única"; exit 1; }
          rg -q "299,99" src/data/pricingPolicy.ts || { echo "R$ 299,99 ausente da fonte única"; exit 1; }
          ! rg -n "bancada-90|taxa-90|visita-90|diagn[oó]stico-90" src e2e
      - name: Gate — capacidade de montagem de PC (rota bloqueada sem prova)
        run: bun run check:pc-assembly-service
      - name: Otimização de fotos (WebP/AVIF)
        run: bun run photos:optimize
      - name: Gate — créditos e privacidade das fotos
        run: bun run check:photos
      - name: Run tests
        run: bun run test
      - name: Build
        env:
          BING_INDEXNOW_KEY: ${{ secrets.BING_INDEXNOW_KEY }}
        run: bun run build
      - name: Guard — IndexNow key file publicado em dist/
        if: env.BING_INDEXNOW_KEY != ''
        env:
          BING_INDEXNOW_KEY: ${{ secrets.BING_INDEXNOW_KEY }}
        run: |
          set -e
          if [ ! -f "dist/${BING_INDEXNOW_KEY}.txt" ]; then
            echo "::error::Arquivo dist/${BING_INDEXNOW_KEY}.txt ausente — build não publicou a verificação IndexNow."
            exit 1
          fi
          CONTENT=$(cat "dist/${BING_INDEXNOW_KEY}.txt")
          if [ "$CONTENT" != "$BING_INDEXNOW_KEY" ]; then
            echo "::error::Conteúdo do arquivo de verificação IndexNow não bate com a chave."
            exit 1
          fi
          echo "OK: arquivo de verificação IndexNow publicado."

      - name: Install Playwright (chromium)
        run: bun run e2e:install
      - name: Run E2E (a11y + flows + tracking)
        run: bun run e2e
      - name: Upload Playwright traces/vídeos (falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-verify
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Start preview server
        run: |
          bun run preview --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
      - name: Validate page images & alt text (/assistencia-tecnica-curitiba)
        run: bun scripts/check-page-images.ts
        env:
          PAGE_BASE_URL: http://localhost:4173
      - name: Canonical parity — canonical do HTML == loc do sitemap
        run: bun run check:canonical
        env:
          CANONICAL_BASE_URL: http://localhost:4173
          CANONICAL_SAMPLE: "25"
          CANONICAL_BATCH: "8"
      - name: Upload canonical parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-parity-report
          path: canonical-parity-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Auditoria — BreadcrumbList, Service/Offer, LocalBusiness e canonical/og
        run: bun run audit:critical-routes -- --reporter=list
        env:
          E2E_BASE_URL: http://localhost:4173
      - name: Gate — JSON-LD sem Service de vertical recusada
        run: bunx tsx scripts/check-refused-verticals.ts
      - name: Gate — title/description únicos, no limite e com og:image
        run: bunx tsx scripts/check-meta-uniqueness.ts
        env:
          META_BASE_URL: http://localhost:4173
          META_SAMPLE: "30"
          META_BATCH: "8"
      - name: Relatório público — paridade FAQ x JSON-LD por localidade
        run: bunx tsx scripts/report-faq-parity.ts
        env:
          FAQ_BASE_URL: http://localhost:4173
          FAQ_SAMPLE: "40"
          FAQ_STRICT: "1"
      - name: Upload relatórios de meta e FAQ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-reports
          path: |
            meta-uniqueness-report.json
            public/relatorios/faq-parity.csv
            public/relatorios/faq-parity.json
          if-no-files-found: ignore
          retention-days: 30

  performance-localidades:
    # Lighthouse por página de bairro/cidade + alerta de regressão após
    # mudanças de imagem ou layout.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Lighthouse — bairros e cidades
        run: bunx @lhci/cli autorun --config=./lighthouserc.locality.cjs
      - name: Alerta de regressão (LCP/CLS/TBT/peso de imagens)
        env:
          PERF_SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bunx tsx scripts/check-perf-regression.ts
      - name: Upload relatórios Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-localidades
          path: lighthouse-reports/locality
          if-no-files-found: ignore
          retention-days: 14

  post-deploy-smoke:
    # Smoke pós-deploy contra produção: index + todos os shards + amostra de
    # 50 URLs por shard, tudo precisa responder 200.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Aguardar propagação do deploy
        run: sleep 60
      - name: Smoke — sitemap index, shards e amostra de URLs (produção)
        run: bun run smoke:sitemap
        env:
          SMOKE_BASE_URL: https://precisodeumtecnico.com
          SMOKE_SAMPLE: "50"
          SMOKE_CONCURRENCY: "8"
      - name: Sitemap status endpoint (dashboard/alertas)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL/ANON_KEY ausentes — pulando /sitemap-status."
            exit 0
          fi
          HTTP=$(curl -sS -o /tmp/status.json -w "%{http_code}" \
            "$SUPABASE_URL/functions/v1/sitemap-status" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          cat /tmp/status.json
          [ "$HTTP" = "200" ] || { echo "::error::sitemap-status HTTP $HTTP"; exit 1; }
      - name: Gate IndexNow — arquivo de verificação 200 e coerência do status
        env:
          BING_INDEXNOW_KEY: ${{ secrets.BING_INDEXNOW_KEY }}
          SITEMAP_STATUS_URL: ${{ secrets.SUPABASE_URL && format('{0}/functions/v1/sitemap-status', secrets.SUPABASE_URL) || '' }}
        run: |
          if [ -z "$BING_INDEXNOW_KEY" ]; then
            echo "::warning::BING_INDEXNOW_KEY ausente — gate IndexNow pulado."
            exit 0
          fi
          bun run check:indexnow -- --remote precisodeumtecnico.com
      - name: Auditoria pós-publish — schemas e metatags em produção
        run: bun run e2e:install && bun run audit:critical-routes -- --reporter=list
        env:
          E2E_BASE_URL: https://precisodeumtecnico.com
      - name: Upload artefatos da auditoria pós-publish (falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-post-deploy
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Canonical parity em produção (amostra)
        run: bun run e2e:install && bun run check:canonical
        env:
          CANONICAL_BASE_URL: https://precisodeumtecnico.com
          CANONICAL_SAMPLE: "25"


  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright (chromium)
        run: bun run e2e:install
      - name: Guard — no service role in frontend
        run: |
          set -e
          if rg -n "SUPABASE_SERVICE_ROLE_KEY|service_role|serviceRole" src/ 2>&1 | rg -v "supabase/functions/"; then
            echo "::error::Service role reference found in frontend code — must live only in edge functions."
            exit 1
          fi
          echo "OK: no service role in src/"
      - name: Guard — no raw GPS coords in analytics payloads
        run: |
          set -e
          # Coordenadas cruas só podem viver em SmartLocationPrompt (persistência
          # local) e reverseGeocode (helper). Aqui garantimos que analytics e
          # auditoria não recebem lat/lng — bucket qualitativo é permitido.
          MATCHES=$(rg -n "latitude|longitude" src/lib/analytics.ts src/lib/waAudit.ts 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Raw GPS coords leaked into analytics/audit code:"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: no raw coords in analytics/audit code."

      - name: Gate — links internos sem 404 / href ausente (hub e cluster)
        run: bunx playwright test e2e/internal-links-no-404.spec.ts --reporter=list
      - name: Gate — UX do hub (mobile e desktop)
        run: bunx playwright test e2e/hub-ux-clickable.spec.ts --reporter=list
      - name: Gate — alt text descritivo em todas as imagens
        run: bunx tsx scripts/check-alt-text.ts
      - name: Gate — integridade de layout (sem overflow/texto cortado)
        run: bunx playwright test e2e/layout-integrity.spec.ts --reporter=list
      - name: Gate — WhatsApp pré-preenchido (serviço, tracking e fallback de geo)
        run: bunx playwright test e2e/wa-prefill-universal.spec.ts --reporter=list


      - name: RLS E2E — wa_bypass_events policy
        run: bunx playwright test e2e/wa-bypass-rls.spec.ts --reporter=list
      - name: Upload Playwright traces/vídeos (falhas)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-security
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  submit-sitemap-gsc:
    # Pinga o Google Search Console quando o sitemap muda em main.
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect sitemap changes
        id: diff
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(public/sitemap|scripts/build-sitemap)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Submit sitemap to Google Search Console
        if: steps.diff.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL/ANON_KEY não configurados nos secrets do repo — pulando submit."
            exit 0
          fi
          curl -sS -X POST "$SUPABASE_URL/functions/v1/submit-sitemap-gsc" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' | tee /tmp/gsc.json
          grep -q '"ok":true' /tmp/gsc.json

  submit-sitemap-indexnow:
    # Pinga Bing/Yandex via IndexNow quando o sitemap muda em main.
    # Requer secrets do repo: SUPABASE_URL, SUPABASE_ANON_KEY.
    # A chave IndexNow em si vive como secret runtime (BING_INDEXNOW_KEY),
    # e o arquivo público /{KEY}.txt deve existir no domínio.
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect sitemap changes
        id: diff
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(public/sitemap|scripts/build-sitemap)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Submit sitemap via IndexNow (Bing/Yandex)
        if: steps.diff.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL/ANON_KEY não configurados — pulando IndexNow."
            exit 0
          fi
          HTTP_STATUS=$(curl -sS -o /tmp/indexnow.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/submit-sitemap-indexnow" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "IndexNow HTTP $HTTP_STATUS"
          cat /tmp/indexnow.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::IndexNow retornou HTTP $HTTP_STATUS"
            exit 1
          fi
          if ! grep -q '"ok":true' /tmp/indexnow.json; then
            echo "::error::Payload IndexNow não contém ok:true"
            exit 1
          fi
          echo "OK: sitemap submetido via IndexNow com sucesso."
      - name: Skip notice
        if: steps.diff.outputs.changed != 'true'
        run: echo "Sitemap não mudou nesse push — IndexNow não acionado."






  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x
      - name: Lighthouse — desktop (curitiba + brasil)
        run: lhci autorun --config=./lighthouserc.cjs
      - name: Lighthouse — mobile (curitiba + brasil)
        run: lhci autorun --config=./lighthouserc.mobile.cjs
      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 14
